<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>来碗 · 餐饮门店智能财务管理与经营分析系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.92);
      --bg-card: #ffffff;
      --bg-card-subtle: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-focus: #10b981;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-emerald: #059669;
      --accent-rose: #e11d48;
      --accent-amber: #d97706;
      --accent-indigo: #4f46e5;
      --accent-sky: #0284c7;
      --badge-bg: #e2e8f0;
      --badge-text: #334155;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
      --table-hover: rgba(241, 245, 249, 0.7);
    }

    [data-theme="dark"] {
      --bg-main: #080d1a;
      --bg-header: rgba(11, 17, 32, 0.92);
      --bg-card: #0f172a;
      --bg-card-subtle: #162035;
      --border-subtle: #1e293b;
      --border-focus: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-indigo: #6366f1;
      --accent-sky: #38bdf8;
      --badge-bg: #1e293b;
      --badge-text: #94a3b8;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
      --table-hover: rgba(30, 41, 59, 0.5);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .mono { font-family: 'Fira Code', monospace; }
    
    .fin-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--card-shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fin-card-hover:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-2px);
    }
    
    .nav-tab-btn {
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .nav-tab-btn:hover {
      color: var(--text-primary);
    }
    .nav-tab-btn.active {
      color: var(--accent-emerald);
      border-bottom-color: var(--accent-emerald);
      background-color: var(--bg-card-subtle);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .no-print { display: none !important; }
      .fin-card { background: #fff !important; border: 1px solid #ddd !important; box-shadow: none !important; color: #000 !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 顶部金融控制台 Header -->
  <header class="sticky top-0 z-40 border-b shadow-sm backdrop-blur-md" style="background-color: var(--bg-header); border-color: var(--border-subtle);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- 品牌与门店标识 -->
      <div class="flex items-center space-x-3.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-extrabold text-xl shadow-lg shadow-emerald-500/20">
          <i data-lucide="line-chart" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight text-current flex items-center gap-1.5">
              来碗 · 财务管理与经营决策中心
            </h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full font-semibold" style="background-color: rgba(16, 185, 129, 0.15); color: var(--accent-emerald);">
              Austin Heights 旗舰店
            </span>
          </div>
          <div class="flex items-center gap-2 text-xs" style="color: var(--text-muted);">
            <span>Optimy POS 底层连通</span>
            <span>•</span>
            <span>Google Sheet 双向同步</span>
            <span>•</span>
            <span id="live-datetime" class="mono">2026-09-17</span>
          </div>
        </div>
      </div>

      <!-- 右侧控制组：深浅色切换、同步、记账 -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- 黑夜/白天模式切换按钮 -->
        <button onclick="toggleTheme()" id="theme-toggle-btn" class="p-2 rounded-xl border text-current transition flex items-center justify-center" style="background-color: var(--bg-card-subtle); border-color: var(--border-subtle);" title="切换白天/暗夜模式">
          <i data-lucide="sun" id="theme-icon-sun" class="w-4 h-4 hidden text-amber-400"></i>
          <i data-lucide="moon" id="theme-icon-moon" class="w-4 h-4 text-sky-400"></i>
        </button>

        <!-- Google Sheet 连通状态指示 -->
        <button onclick="switchTab('settings')" class="hidden sm:flex items-center gap-2 text-xs px-3 py-1.5 rounded-xl border transition" style="background-color: var(--bg-card-subtle); border-color: var(--border-subtle);" title="点击查看 Google Sheet 联通与 Webhook 设置">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="sync-text" class="text-xs font-medium" style="color: var(--text-secondary);">Sheet 实时连通</span>
          <i data-lucide="external-link" class="w-3 h-3 text-slate-400"></i>
        </button>

        <!-- 恢复官方数据 -->
        <button onclick="restoreAllSheetData()" class="p-2 sm:px-3 sm:py-1.5 rounded-xl border text-xs font-semibold transition flex items-center gap-1.5 text-sky-600 dark:text-sky-400 hover:bg-sky-500/10" style="background-color: var(--bg-card-subtle); border-color: var(--border-subtle);" title="从 Google Sheet 重新载入所有原始财务数据（防止误删）">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">恢复初始数据</span>
        </button>

        <!-- 刷新数据 -->
        <button onclick="reloadAndRecalculate()" class="p-2 sm:px-3 sm:py-1.5 rounded-xl border text-xs font-medium transition flex items-center gap-1.5" style="background-color: var(--bg-card-subtle); border-color: var(--border-subtle); color: var(--text-primary);">
          <i data-lucide="rotate-cw" id="refresh-spinner" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">重新核算</span>
        </button>

        <!-- 记一笔开销主按钮 -->
        <button onclick="openAddExpenseModal()" class="text-xs px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-md shadow-emerald-600/30 transition flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>记一笔</span>
        </button>

        <!-- 回到点餐前台 -->
        <a href="index.html" class="p-2 sm:px-2.5 sm:py-1.5 rounded-xl border text-xs transition flex items-center gap-1" style="background-color: var(--bg-card-subtle); border-color: var(--border-subtle); color: var(--text-muted);" title="返回顾客点餐前台">
          <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
          <span class="hidden md:inline">点餐前台</span>
        </a>
      </div>
    </div>

    <!-- 导航选项卡 (支持横向滑动) -->
    <div class="border-t overflow-x-auto no-scrollbar" style="border-color: var(--border-subtle); background-color: var(--bg-header);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-1 py-1 text-xs sm:text-sm font-medium">
        <button onclick="switchTab('overview')" id="nav-btn-overview" class="nav-tab-btn active px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span>经营总览 (实时KPI)</span>
        </button>
        <button onclick="switchTab('expenses')" id="nav-btn-expenses" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="receipt" class="w-4 h-4 text-rose-500"></i>
          <span>运营杂支台账 (可编辑)</span>
          <span id="nav-badge-expenses" class="text-[10px] px-1.5 py-0.2 rounded-full mono font-bold" style="background: rgba(244,63,94,0.15); color: var(--accent-rose);">6</span>
        </button>
        <button onclick="switchTab('revenue')" id="nav-btn-revenue" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="banknote" class="w-4 h-4 text-emerald-500"></i>
          <span>每日营收实收 (可编辑)</span>
          <span id="nav-badge-revenue" class="text-[10px] px-1.5 py-0.2 rounded-full mono font-bold" style="background: rgba(16,185,129,0.15); color: var(--accent-emerald);">5</span>
        </button>
        <button onclick="switchTab('suppliers')" id="nav-btn-suppliers" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="truck" class="w-4 h-4 text-amber-500"></i>
          <span>供应商进货对账</span>
          <span id="nav-badge-suppliers" class="text-[10px] px-1.5 py-0.2 rounded-full mono font-bold" style="background: rgba(245,158,11,0.15); color: var(--accent-amber);">5</span>
        </button>
        <button onclick="switchTab('delivery')" id="nav-btn-delivery" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="bike" class="w-4 h-4 text-sky-500"></i>
          <span>外卖扣点审计</span>
        </button>
        <button onclick="switchTab('dishes')" id="nav-btn-dishes" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i>
          <span>58道菜品毛利透视</span>
        </button>
        <button onclick="switchTab('pnl')" id="nav-btn-pnl" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="file-text" class="w-4 h-4 text-emerald-500"></i>
          <span>损益表 (P&L) 导出打印</span>
        </button>
        <button onclick="switchTab('menu-manager')" id="nav-btn-menu-manager" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i>
          <span>在线点餐菜单管理 (Sync GitHub)</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold bg-emerald-500/20 text-emerald-500">Live</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-btn-settings" class="nav-tab-btn px-3.5 py-2 rounded-lg flex items-center gap-2 whitespace-nowrap">
          <i data-lucide="settings" class="w-4 h-4 text-cyan-500"></i>
          <span>Google Sheet 设置</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

    <!-- TAB 1 to 8 omitted for brevity in call, but present in full file string -->
  </main>
</body>
</html>
